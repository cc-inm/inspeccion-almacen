<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inspección Diaria de Almacén</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#e9f3ff,#f4f7fa);
    min-height:100vh;
    padding:15px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;
    background:url("logo.png") center center no-repeat;
    background-size:280px;
    opacity:.04;
    pointer-events:none;
}

.header,
form{
    position:relative;
    z-index:2;
}

.logo{
    width:120px;
    display:block;
    margin:auto;
    margin-bottom:10px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#0b4f6c;
    font-size:1.5rem;
}

.header p{
    color:#666;
    margin-top:5px;
}

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:15px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d5dce3;
    border-radius:10px;
    font-size:16px;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#0b4f6c;
    box-shadow:0 0 0 3px rgba(11,79,108,.15);
}

textarea{
    min-height:120px;
    resize:vertical;
}

.readonly{
    background:#f2f2f2;
    font-weight:600;
}

#preview{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

#preview img{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#25D366;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1ebd59;
}

@media(min-width:768px){

    .grid{
        grid-template-columns:1fr 1fr;
    }

    #preview{
        grid-template-columns:repeat(4,1fr);
    }

    .container{
        padding:30px;
    }

    .logo{
        width:140px;
    }
}

</style>
</head>

<body>

<div class="container">

<div class="header">

<img src="logo.png"
     alt="Moravia Salud Animal"
     class="logo">

<h1>📋 Inspección Diaria de Almacén</h1>

<p>
Moravia Salud Animal<br>
Control de Recepción y Almacenamiento
</p>

</div>

<form id="inspeccionForm">

<div class="grid">

<div class="form-group">
<label>Día</label>
<input type="date" id="dia" required>
</div>

<div class="form-group">
<label>Hora</label>
<input type="time" id="hora" required>
</div>

</div>

<div class="grid">

<div class="form-group">
<label>Área</label>

<select id="area" required>
<option value="71">71</option>
<option value="71A">71A</option>
</select>

</div>

<div class="form-group">
<label>Proveedor</label>

<select id="proveedor" required>
<option value="ALCAMES">ALCAMES</option>
<option value="AVIMEX">AVIMEX</option>
<option value="CALOX">CALOX</option>
<option value="CENTRAL VETERINARIA">CENTRAL VETERINARIA</option>
<option value="CEETAL">CEETAL</option>
<option value="LHAURA">LHAURA</option>
<option value="MEFORSAN">MEFORSAN</option>
<option value="OTRO">OTRO</option>
<option value="PURINA">PURINA</option>
<option value="ZOETIS">ZOETIS</option>
</select>

</div>

</div>

<div class="form-group">

<label>Gestor de Calidad</label>

<input
type="text"
id="gestor"
value="Pricila Sanchez"
readonly
class="readonly">

</div>

<div class="form-group">

<label>Observaciones</label>

<textarea
id="observaciones"
placeholder="Ingrese observaciones de la inspección"></textarea>

</div>

<div class="form-group">

<label>📸 Evidencias Fotográficas</label>

<input
    type="file"
    id="evidencias"
    accept="image/*"
    multiple>

<div id="preview"></div>

</div>

<button type="submit">

📲 Enviar Reporte a WhatsApp

</button>

</form>

</div>

<script>

// ===== FECHA Y HORA AUTOMÁTICAS =====

document.addEventListener("DOMContentLoaded",()=>{

    const ahora = new Date();

    document.getElementById("dia").value =
    ahora.toISOString().split("T")[0];

    document.getElementById("hora").value =
    String(ahora.getHours()).padStart(2,'0')
    + ":" +
    String(ahora.getMinutes()).padStart(2,'0');

});

// ===== PREVIEW DE IMÁGENES =====

const evidenciaInput =
document.getElementById("evidencias");

const preview =
document.getElementById("preview");

evidenciaInput.addEventListener("change",()=>{

    preview.innerHTML = "";

    [...evidenciaInput.files].forEach(file=>{

        const reader = new FileReader();

        reader.onload = function(e){

            const img = document.createElement("img");

            img.src = e.target.result;

            preview.appendChild(img);

        };

        reader.readAsDataURL(file);

    });

});

// ===== ENVÍO A WHATSAPP =====

document
.getElementById("inspeccionForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const dia =
    document.getElementById("dia").value;

    const hora =
    document.getElementById("hora").value;

    const area =
    document.getElementById("area").value;

    const proveedor =
    document.getElementById("proveedor").value;

    const gestor =
    document.getElementById("gestor").value;

    const observaciones =
    document.getElementById("observaciones").value
    || "Sin observaciones";

    const fotos =
    document.getElementById("evidencias").files;

    const evidenciaTexto =
    fotos.length > 0
    ? fotos.length + " fotografía(s) registrada(s)"
    : "Sin evidencias";

    const mensaje =

`📋 *INSPECCIÓN DIARIA DE ALMACÉN*

📅 *Día:* ${dia}

🕒 *Hora:* ${hora}

🏢 *Área:* ${area}

🚚 *Proveedor:* ${proveedor}

👤 *Gestor de Calidad:* ${gestor}

📝 *Observaciones:*
${observaciones}

📸 *Evidencias:*
${evidenciaTexto}

✅ Reporte generado desde Inspección Diaria de Almacén`;

    // CAMBIAR POR TU NÚMERO

    const numeroWhatsApp =
    "50431810929";

    const url =
    `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
    

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
    window.open(
   "https://forms.cloud.microsoft/r/dVarhrPk0N",
   "_blank"
);
    window.open(
   urlWhatsApp,
   "_blank"
);

});

</script>

</body>
</html>
